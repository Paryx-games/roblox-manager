<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Manager — Whoops state</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0b;
    --border: rgba(255,255,255,0.07);
    --text: #f0f0f1;
    --text-dim: #8a8a90;
    --icon: #9a9aa0;
    --icon-hover: #c7c7cc;
    --icon-active: #eef2ff;
    --sidebar-w: 56px;

    --accent: #3e63f6; /* change this one line to reskin the sidebar accent */
    --blue-hover-bar: color-mix(in srgb, var(--accent) 55%, transparent);
    --blue-active-bar: var(--accent);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family: "Roboto", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  svg{ display:block; }

  /* ---------- titlebar ---------- */
  .titlebar{
    height:36px;
    flex-shrink:0;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    border-bottom:1px solid var(--border);
  }
  .titlebar-logo{ color: var(--icon); display:flex; align-items:center; }
  .titlebar-logo svg{ width:17px; height:17px; }
  .titlebar-version{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:13px;
    color: var(--text-dim);
    letter-spacing:0.2px;
  }
  .window-controls{ display:flex; align-items:center; gap:22px; }
  .window-controls svg{ width:14px; height:14px; color: var(--icon); }

  /* ---------- header row ---------- */
  .header-row{
    height:42px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    padding-left:16px;
    border-bottom:1px solid var(--border);
  }
  .header-title{
    font-size:14px;
    font-weight:700;
    color: var(--text);
  }

  /* ---------- body: sidebar (full height) + right column (header + content) ---------- */
  .body-row{ flex:1; display:flex; min-height:0; }
  .main-col{ flex:1; display:flex; flex-direction:column; min-width:0; }

  .sidebar{
    width: var(--sidebar-w);
    flex-shrink:0;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    padding:12px 0;
    gap:2px;
  }
  .sidebar-spacer{ flex:1; }

  /* each button is full sidebar width so the accent bar can sit flush on the left edge */
  .side-item{
    position:relative;
    width:100%;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* left accent bar: sits collapsed at 0 height, grows outward from its own center */
  .side-item .accent-bar{
    position:absolute;
    left:0;
    top:50%;
    width:3px;
    height:20px;
    border-radius:0 3px 3px 0;
    background: var(--blue-hover-bar);
    transform: translateY(-50%) scaleY(0);
    transform-origin:center;
    transition: transform 0.18s ease, background-color 0.18s ease;
  }

  /* the rounded highlight box behind the icon itself */
  .side-item .icon-box{
    width:38px;
    height:38px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--icon);
    background: transparent;
    transition: background-color 0.18s ease, color 0.18s ease;
  }
  .side-item .icon-box svg{ width:19px; height:19px; }

  /* hover = clickable affordance: bar grows in from the middle, box gets a soft white fill */
  .side-item:hover .accent-bar{
    transform: translateY(-50%) scaleY(1);
    background: var(--blue-hover-bar);
  }
  .side-item:hover .icon-box{
    background: rgba(255,255,255,0.08);
    color: var(--icon-hover);
  }

  /* active = actually clicked/selected: bar grows a bit taller than the hover state, box fill is a touch brighter white */
  .side-item.active .accent-bar{
    transform: translateY(-50%) scaleY(1.3);
    background: var(--blue-active-bar);
  }
  .side-item.active .icon-box{
    background: rgba(255,255,255,0.12);
    color: var(--icon-active);
  }
  /* hovering an already-active button keeps the active look, doesn't fall back to the hover tone */
  .side-item.active:hover .accent-bar{
    transform: translateY(-50%) scaleY(1.3);
    background: var(--blue-active-bar);
  }
  .side-item.active:hover .icon-box{
    background: rgba(255,255,255,0.12);
    color: var(--icon-active);
  }

  .content{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
  }
  .empty-state{ text-align:center; max-width:560px; }
  .empty-state h1{
    font-size:22px;
    font-weight:700;
    color: var(--text);
    margin-bottom:14px;
  }
  .empty-state p{
    font-size:15px;
    line-height:1.6;
    color: var(--text-dim);
  }

  /* ---------- tooltips ---------- */
  /* bubble + arrow are the only two pseudo-elements an element gets, which is exactly what we need */
  [data-tip]{ position:relative; }

  [data-tip]::after{
    content: attr(data-tip);
    position:absolute;
    padding:6px 10px;
    border-radius:6px;
    background:#1a1b1f;
    border:1px solid var(--border);
    color: var(--text);
    font-size:12px;
    font-weight:500;
    white-space:nowrap;
    box-shadow:0 8px 20px rgba(0,0,0,0.45);
    opacity:0;
    pointer-events:none;
    transition: opacity .15s ease, transform .15s ease;
    z-index:50;
  }
  [data-tip]::before{
    content:"";
    position:absolute;
    width:6px; height:6px;
    background:#1a1b1f;
    border:1px solid var(--border);
    opacity:0;
    pointer-events:none;
    transition: opacity .15s ease, transform .15s ease;
    z-index:51;
  }

  /* right-side tooltip: for the icon rail, bubble slides in from the left as it appears */
  .tip-right::after{
    left:calc(100% + 10px);
    top:50%;
    transform: translateY(-50%) translateX(-6px);
  }
  .tip-right::before{
    left:calc(100% + 4px);
    top:50%;
    border-right:none;
    border-top:none;
    transform: translateY(-50%) rotate(45deg) translateX(-6px);
  }
  .tip-right:hover::after,
  .tip-right:focus-visible::after{
    opacity:1;
    transform: translateY(-50%) translateX(0);
    transition-delay:.3s;
  }
  .tip-right:hover::before,
  .tip-right:focus-visible::before{
    opacity:1;
    transform: translateY(-50%) rotate(45deg) translateX(0);
    transition-delay:.3s;
  }

  /* bottom tooltip: for the window controls, bubble slides down as it appears */
  .tip-bottom::after{
    top:calc(100% + 10px);
    left:50%;
    transform: translateX(-50%) translateY(-6px);
  }
  .tip-bottom::before{
    top:calc(100% + 4px);
    left:50%;
    border-bottom:none;
    border-right:none;
    transform: translateX(-50%) rotate(45deg) translateY(-6px);
  }
  .tip-bottom:hover::after,
  .tip-bottom:focus-visible::after{
    opacity:1;
    transform: translateX(-50%) translateY(0);
    transition-delay:.3s;
  }
  .tip-bottom:hover::before,
  .tip-bottom:focus-visible::before{
    opacity:1;
    transform: translateX(-50%) rotate(45deg) translateY(0);
    transition-delay:.3s;
  }

  .wc-btn{
    background:none;
    border:none;
    padding:0;
    display:flex;
    align-items:center;
    cursor:pointer;
    color:inherit;
  }
</style>
</head>
<body>

  <div class="titlebar">
    <div class="titlebar-logo">
      <!-- lucide: feather -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.086 18.412A2 2 0 0112.67 19H5v-7.672a2 2 0 01.586-1.414L11.75 3.75a6 6 0 118.49 8.49z"/>
        <path d="M16 8 2 22"/>
        <path d="M17.488 15H9"/>
      </svg>
    </div>

    <div class="titlebar-version">1.3.7</div>

    <div class="window-controls">
      <button class="wc-btn tip-bottom" type="button" data-tip="Minimize" aria-label="Minimize">
        <!-- lucide: minus -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
      </button>
      <button class="wc-btn tip-bottom" type="button" data-tip="Maximize" aria-label="Maximize">
        <!-- lucide: square -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
      </button>
      <button class="wc-btn tip-bottom" type="button" data-tip="Close" aria-label="Close">
        <!-- lucide: x -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>

  <div class="body-row">
    <nav class="sidebar">
      <button class="side-item nav active tip-right" type="button" data-tip="Instances" aria-label="Instances">
        <span class="accent-bar"></span>
        <span class="icon-box">
          <!-- lucide: package -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/>
            <path d="M12 22V12"/>
            <polyline points="3.29 7 12 12 20.71 7"/>
            <path d="m7.5 4.27 9 5.15"/>
          </svg>
        </span>
      </button>

      <button class="side-item nav tip-right" type="button" data-tip="Client Manager" aria-label="Client Manager">
        <span class="accent-bar"></span>
        <span class="icon-box">
          <!-- lucide: app-window -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M10 4v4"/>
            <path d="M2 8h20"/>
            <path d="M6 4v4"/>
          </svg>
        </span>
      </button>

      <button class="side-item nav tip-right" type="button" data-tip="Accounts" aria-label="Accounts">
        <span class="accent-bar"></span>
        <span class="icon-box">
          <!-- lucide: id-card -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 10h2"/>
            <path d="M16 14h2"/>
            <path d="M6.17 15a3 3 0 0 1 5.66 0"/>
            <circle cx="9" cy="11" r="2"/>
            <rect x="2" y="5" width="20" height="14" rx="2"/>
          </svg>
        </span>
      </button>

      <div class="sidebar-spacer"></div>

      <button class="side-item tip-right" type="button" data-tip="Clear Cache" aria-label="Clear Cache">
        <span class="accent-bar"></span>
        <span class="icon-box">
          <!-- lucide: eraser -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21"/>
            <path d="m5.082 11.09 8.828 8.828"/>
          </svg>
        </span>
      </button>

      <button class="side-item tip-right" type="button" data-tip="Settings" aria-label="Settings">
        <span class="accent-bar"></span>
        <span class="icon-box">
          <!-- lucide: settings -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
      </button>
    </nav>

    <div class="main-col">
      <div class="header-row">
        <div class="header-title">Client Manager</div>
      </div>

      <main class="content">
        <div class="empty-state">
          <h1>Whoops!</h1>
          <p>You need to disable 'Auto-Pick Clients' inside the settings to use this feature.</p>
        </div>
      </main>
    </div>
  </div>

  <script>
    // only the top nav group is a mutually-exclusive page selector;
    // eraser/settings are actions, not persisted state
    const navItems = document.querySelectorAll('.side-item.nav');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>

</body>
</html>
