# dependency review action
#
# checks dependency changes introduced by pull requests for known vulnerabilities.
# this helps prevent a pull request from introducing a dependency with a known
# high or critical severity vulnerability.
#
# source repository:
# https://github.com/actions/dependency-review-action
#
# documentation:
# https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review

name: dependency review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # show a dependency review summary directly in the pull request.
          comment-summary-in-pr: always

          # block pull requests that introduce high or critical severity
          # vulnerabilities.
          fail-on-severity: high
