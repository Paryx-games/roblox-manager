name: rust

on:
  push:
    branches:
      - main
      - v2
    paths:
      - "ram_core/**"
      - "ram_ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "bump-version.bat"
      - "clippy.toml"
      - "assets/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ram_core/**"
      - "ram_ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "bump-version.bat"
      - "clippy.toml"
      - "assets/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ram_ui/pnpm-lock.yaml

      - name: install frontend dependencies
        working-directory: ram_ui
        run: pnpm install --frozen-lockfile

      - name: setup rust for version tooling
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust

      - name: validate application version
        working-directory: ram_ui
        shell: pwsh
        run: pnpm run version:check

      - name: build frontend
        working-directory: ram_ui
        run: pnpm build

      - name: lint frontend
        run: pnpm --dir ram_ui lint

      - name: type check frontend
        run: pnpm --dir ram_ui typecheck

      - name: test frontend
        run: pnpm --dir ram_ui test

      # shared with clippy and test jobs so they don't rebuild it
      - name: upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ram_ui-dist
          path: ram_ui/dist
          retention-days: 1
          if-no-files-found: error

  fmt:
    name: fmt
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust
        with:
          components: rustfmt

      - name: check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ram_ui-dist
          path: ram_ui/dist

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust
        with:
          components: clippy

      - name: cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ram_ui-dist
          path: ram_ui/dist

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust

      - name: cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: test
        run: cargo test --workspace --all-features --locked

  build:
    name: build
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust

      - name: cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ram_ui/pnpm-lock.yaml

      - name: install frontend dependencies
        run: pnpm --dir ram_ui install --frozen-lockfile

      - name: build tauri application and installer
        run: pnpm --dir ram_ui tauri build --ci --bundles nsis -- --locked

      - name: upload tauri build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-windows-build
          path: |
            target/release/rm_tauri.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
