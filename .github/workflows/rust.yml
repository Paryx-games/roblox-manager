name: rust

on:
  push:
    branches:
      - main
    paths:
      - "ram_core/**"
      - "ram_ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ram_core/**"
      - "ram_ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ram_ui/pnpm-lock.yaml

      - name: install frontend dependencies
        working-directory: ram_ui
        run: pnpm install --frozen-lockfile

      - name: build frontend
        working-directory: ram_ui
        run: pnpm build

      # shared with clippy/test/build jobs so they don't each rebuild it
      - name: upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: ram_ui-dist
          path: ram_ui/dist
          retention-days: 1

  fmt:
    name: fmt
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: ram_ui-dist
          path: ram_ui/dist

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cache rust
        uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: ram_ui-dist
          path: ram_ui/dist

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache rust
        uses: Swatinem/rust-cache@v2

      - name: test
        run: cargo test --workspace --all-features --locked

  build:
    name: build
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: ram_ui-dist
          path: ram_ui/dist

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache rust
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --workspace --all-features --locked
