name: docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".markdownlint.json"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".markdownlint.json"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: lint markdown
        run: npx --yes markdownlint-cli2@0.20.0 "docs/**/*.md"
