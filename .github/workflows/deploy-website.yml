name: deploy website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: build
        working-directory: website
        run: pnpm build

      - name: setup pages
        uses: actions/configure-pages@v5

      - name: inspect pages artifact
        working-directory: website
        run: |
          echo "=== files ==="
          find dist -type f -print
          echo "=== index.html ==="
          cat dist/index.html

      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./website/dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v5
