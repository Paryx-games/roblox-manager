name: CI
run-name: >-
  ${{ github.event_name == 'pull_request_target' && format('Label PR #{0}', github.event.pull_request.number) || github.event_name == 'pull_request' && format('CI for PR #{0}', github.event.pull_request.number) || format('CI for {0}', github.ref_name) }}

on:
  push:
    branches:
      - main
      - v2

  # Lets you deliberately validate an older/cancelled commit before tagging it.
  workflow_dispatch:

  pull_request:

  # only the label job runs here, using scripts from the trusted base commit
  pull_request_target: # zizmor: ignore[dangerous-triggers] label job only executes trusted base code
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  changes:
    name: Select checks from changed files
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      frontendBuild: ${{ steps.select.outputs.frontendBuild }}
      rust: ${{ steps.select.outputs.rust }}
      build: ${{ steps.select.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select required checks
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/ci-plan.cjs').select({ github, context, core });

  frontend-build:
    name: Frontend build and version check
    needs: changes
    if: needs.changes.outputs.frontendBuild == 'true'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ram_ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ram_ui
        run: pnpm install --frozen-lockfile

      - name: Validate application version
        working-directory: ram_ui
        shell: pwsh
        run: pnpm run version:check

      - name: Build frontend
        working-directory: ram_ui
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ram_ui-dist
          path: ram_ui/dist
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend lint, types and tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ram_ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ram_ui
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --dir ram_ui lint

      - name: Type check frontend
        run: pnpm --dir ram_ui typecheck

      - name: Test frontend
        run: pnpm --dir ram_ui test

  fmt:
    name: Rust formatting
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust lint (Clippy)
    needs: [changes, frontend-build]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ram_ui-dist
          path: ram_ui/dist

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust
        with:
          components: clippy

      - name: Cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-tauri
          save-if: false

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Rust tests
    needs: [changes, frontend-build]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ram_ui-dist
          path: ram_ui/dist

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust

      - name: Cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-tauri
          save-if: false

      - name: Test
        run: cargo test --workspace --all-features --locked

  build:
    name: Windows application and installer
    needs: [changes, frontend-build, frontend]
    if: >-
      always() && !cancelled() && needs.changes.outputs.build == 'true' &&
      needs.frontend-build.result == 'success' &&
      (needs.frontend.result == 'success' ||
       (needs.changes.outputs.frontend == 'false' && needs.frontend.result == 'skipped'))
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust

      # This is the trusted writer for the cache consumed by release.yml.
      # PRs and other refs may restore it, but only main may save it.
      - name: Cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ram_ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir ram_ui install --frozen-lockfile

      - name: Build tauri application and installer
        run: pnpm --dir ram_ui tauri build --ci --bundles nsis -- --locked

      - name: Upload tauri build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-windows-build
          path: |
            target/release/rm_tauri.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  zizmor:
    name: Workflow security (Zizmor)
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows and Dependabot online
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          inputs: .github
          online-audits: true
          advanced-security: false
          annotations: true
          token: ${{ github.token }}

  workflow-check:
    name: Workflow syntax and CI script tests
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test CI selection and reporting
        run: node --test .github/scripts/*.test.cjs
      - name: Install pinned Actionlint
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate all workflows
        shell: bash
        run: '"$RUNNER_TEMP/actionlint"'

  passed:
    name: CI passed
    needs: [changes, frontend-build, frontend, fmt, clippy, test, build, workflow-check, zizmor]
    if: always() && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all selected checks to pass
        run: node .github/scripts/ci-gate.cjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

  label:
    name: PR labels
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Checkout trusted label scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Sync labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/ci-plan.cjs').label({ github, context });
