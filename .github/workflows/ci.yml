name: CI
run-name: >-
  ${{ github.event_name == 'pull_request_target' && format('Label PR #{0}', github.event.pull_request.number) || github.event_name == 'pull_request' && format('CI for PR #{0}', github.event.pull_request.number) || format('CI for {0}', github.ref_name) }}

on:
  push:
    branches:
      - main
      - v2

  # Lets you deliberately validate an older/cancelled commit before tagging it.
  workflow_dispatch:

  pull_request:

  # only the API-only label job runs in this privileged context
  pull_request_target: # zizmor: ignore[dangerous-triggers] label job never checks out or executes PR code
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend build and version check
    if: github.event_name != 'pull_request_target'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ram_ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ram_ui
        run: pnpm install --frozen-lockfile

      - name: Validate application version
        working-directory: ram_ui
        shell: pwsh
        run: pnpm run version:check

      - name: Build frontend
        working-directory: ram_ui
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ram_ui-dist
          path: ram_ui/dist
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend lint, types and tests
    if: github.event_name != 'pull_request_target'
    needs: frontend-build
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ram_ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ram_ui
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --dir ram_ui lint

      - name: Type check frontend
        run: pnpm --dir ram_ui typecheck

      - name: Test frontend
        run: pnpm --dir ram_ui test

  fmt:
    name: Rust formatting
    if: github.event_name != 'pull_request_target'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust lint (Clippy)
    if: github.event_name != 'pull_request_target'
    needs: frontend-build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ram_ui-dist
          path: ram_ui/dist

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust
        with:
          components: clippy

      - name: Cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-tauri
          save-if: false

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Rust tests
    if: github.event_name != 'pull_request_target'
    needs: frontend-build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ram_ui-dist
          path: ram_ui/dist

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust

      - name: Cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-tauri
          save-if: false

      - name: Test
        run: cargo test --workspace --all-features --locked

  build:
    name: Windows application and installer
    if: github.event_name != 'pull_request_target'
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust

      # This is the trusted writer for the cache consumed by release.yml.
      # PRs and other refs may restore it, but only main may save it.
      - name: Cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ram_ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir ram_ui install --frozen-lockfile

      - name: Build tauri application and installer
        run: pnpm --dir ram_ui tauri build --ci --bundles nsis -- --locked

      - name: Upload tauri build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-windows-build
          path: |
            target/release/rm_tauri.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  zizmor:
    name: Workflow security (Zizmor)
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: zizmor

      - name: Install zizmor
        run: cargo install --locked zizmor --version 1.30.1

      - name: Run zizmor
        run: zizmor .github/workflows/
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  label:
    name: PR labels
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Sync labels
        # pin to a commit sha for supply chain safety
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: issue_number, per_page: 100 },
            );
            const paths = files.map(({ filename }) => filename);

            const rules = {
              rust: /\.rs$|(?:^|\/)Cargo\.(?:toml|lock)$/i,
              javascript:
                /\.(?:js|jsx|mjs|cjs|ts|tsx)$|(?:^|\/)(?:package\.json|pnpm-lock\.yaml)$/i,
              "github-actions": /^\.github\/workflows\/.+\.ya?ml$/i,
              documentation:
                /(?:^|\/)(?:README|CHANGELOG|CONTRIBUTING|SECURITY|CODE_OF_CONDUCT)(?:\.[^/]*)?$|\.mdx?$|^docs\//i,
            };

            const wanted = new Set(
              Object.entries(rules)
                .filter(([, pattern]) => paths.some((p) => pattern.test(p)))
                .map(([label]) => label),
            );

            const current = await github.paginate(
              github.rest.issues.listLabelsOnIssue,
              { owner, repo, issue_number, per_page: 100 },
            );
            const currentNames = new Set(current.map(({ name }) => name));

            // only touch labels this workflow owns, never manual ones
            const managed = Object.keys(rules);

            const toAdd = [...wanted].filter((l) => !currentNames.has(l));
            const toRemove = managed.filter(
              (l) => currentNames.has(l) && !wanted.has(l),
            );

            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: toAdd,
              });
            }

            for (const name of toRemove) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name,
              });
            }
