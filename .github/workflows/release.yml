name: release
on:
  push:
    branches:
      - main
    tags:
      - "v*"
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: check
    if: github.ref_type == 'branch'
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      # clippy implies check, so there's no separate cargo check step.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
  build:
    name: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release
      - name: upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ram_ui
          path: target/release/ram_ui.exe
          retention-days: 1
  release:
    name: release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: windows-latest
    steps:
      - name: download executable
        uses: actions/download-artifact@v4
        with:
          name: ram_ui
          path: release
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/ram_ui.exe
          body: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
