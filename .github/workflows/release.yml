name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # tags float on the same commit as their branch, cache key should track the lockfile not the ref
          key: release

      - name: build
        run: cargo build --release

      - name: upload executable
        uses: actions/upload-artifact@v4
        with:
          name: release-executable
          path: target/release/ram_ui.exe
          retention-days: 1
          compression-level: 0

  release:
    name: release
    needs: build
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: download executable
        uses: actions/download-artifact@v8
        with:
          name: release-executable
          path: release

      - name: get previous tag
        id: previous-tag
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          $tags = git tag --sort=-version:refname |
            Where-Object { $_ -ne $currentTag -and $_ -like "v*" }

          if (-not $tags) {
            "value=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          "value=$($tags[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: extract changelog
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $path = "CHANGELOG.md"
          $lines = Get-Content $path

          $start = -1
          $end = $lines.Count

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## $([regex]::Escape($version))$") {
              $start = $i
              break
            }
          }

          if ($start -eq -1) {
            throw "No changelog entry found for $version"
          }

          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## ") {
              $end = $i
              break
            }
          }

          $section = ($lines[$start..($end - 1)] -join "`n")
          Set-Content -Path release-notes.md -Value $section

      - name: generate github release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "${{ github.ref_name }}"
          $previousTag = "${{ steps.previous-tag.outputs.value }}"
          $repository = "${{ github.repository }}"

          if ($previousTag) {
            $response = gh api `
              --method POST `
              "repos/$repository/releases/generate-notes" `
              -f "tag_name=$currentTag" `
              -f "target_commitish=${{ github.sha }}" `
              -f "previous_tag_name=$previousTag"
          } else {
            $response = gh api `
              --method POST `
              "repos/$repository/releases/generate-notes" `
              -f "tag_name=$currentTag" `
              -f "target_commitish=${{ github.sha }}"
          }

          $generated = $response | ConvertFrom-Json
          $notes = $generated.body

          Set-Content -Path github-release-notes.md -Value $notes.Trim()

      # rename the built exe to roblox-manager-vX.Y.Z-windows-x64.exe, arch detected from runner env
      - name: rename executable
        id: rename-exe
        shell: pwsh
        run: |
          $exePath = "release/ram_ui.exe"

          if (-not (Test-Path $exePath)) {
            throw "ram_ui.exe was not found in the release directory."
          }

          $version = "${{ github.ref_name }}" -replace "^v", ""

          $os = "windows"
          $arch = switch ($env:PROCESSOR_ARCHITECTURE) {
            "AMD64"   { "x64" }
            "ARM64"   { "arm64" }
            "x86"     { "x86" }
            default   { $env:PROCESSOR_ARCHITECTURE.ToLower() }
          }

          $newName = "roblox-manager-v$version-$os-$arch.exe"
          $newPath = "release/$newName"

          Rename-Item -Path $exePath -NewName $newName

          "filename=$newName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "path=$newPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # sha256 for the single release exe
      - name: generate sha256 checksums
        shell: pwsh
        run: |
          $exePath = "${{ steps.rename-exe.outputs.path }}"
          $exeName = "${{ steps.rename-exe.outputs.filename }}"

          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()

          $lines = @(
            "## SHA256"
            ""
            "Checksums for all executable files included in this release."
            ""
            "- ``$exeName`` - ``$hash``"
          )

          Set-Content -Path sha256.md -Value ($lines -join "`n")

      # builds the download table from whatever exes are actually in release/, so
      # adding a new arch job later just adds a row here for free, no edits needed
      - name: build download table
        shell: pwsh
        run: |
          $archDescriptions = @{
            "windows-x64"   = "For a normal Intel or AMD Windows PC"
            "windows-arm64" = "For a Windows PC with an ARM processor"
            "windows-x86"   = "For a 32-bit Windows PC"
          }

          $repository = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"

          $files = Get-ChildItem -Path release -Filter "*.exe" | Sort-Object Name

          $rows = foreach ($file in $files) {
            if ($file.Name -match "^roblox-manager-v[\d.]+(?:-[\w.]+)?-(?<platform>[a-z]+-[a-z0-9]+)\.exe$") {
              $platform = $Matches.platform
              $description = $archDescriptions[$platform]
              if (-not $description) {
                $description = "Platform: $platform"
              }
              $downloadUrl = "https://github.com/$repository/releases/download/$tag/$($file.Name)"
              "| [``$($file.Name)``]($downloadUrl) | $description |"
            }
          }

          $lines = @(
            "<details>"
            "<summary>Which download do I want?</summary>"
            ""
            "| File | Use case |"
            "| --- | --- |"
          ) + $rows + @(
            ""
            "</details>"
          )

          Set-Content -Path downloads-table.md -Value ($lines -join "`n")

      - name: assemble release notes
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"

          $changelog = (Get-Content -Path release-notes.md -Raw).Trim()
          $downloadsTable = (Get-Content -Path downloads-table.md -Raw).Trim()
          $githubNotes = (Get-Content -Path github-release-notes.md -Raw).Trim()
          $sha256 = (Get-Content -Path sha256.md -Raw).Trim()

          # drop the native "New Contributors" section entirely, not used
          $splitMarker = "## New Contributors"
          $splitIndex = $githubNotes.IndexOf($splitMarker)

          if ($splitIndex -ge 0) {
            $githubNotes = $githubNotes.Substring(0, $splitIndex).Trim()
          }

          # github alerts (> [!NOTE]) render unreliably when nested inside <details>,
          # so this lives as its own top-level block right above the collapsible section
          $githubNotesBox = @"
          > [!NOTE]
          > The section below may be inaccurate, as it's auto-generated by GitHub Actions. See [CHANGELOG.md](https://github.com/Paryx-games/roblox-manager/blob/main/CHANGELOG.md) for the maintained changelog.

          <details>
          <summary>GitHub-generated notes</summary>

          $githubNotes

          </details>
          "@

          # pre-release tags get an extra notice stacked under the standard one
          $prereleaseWarning = ""
          $rcMatch = [regex]::Match($currentTag, "-rc\.(\d+)")

          if ($rcMatch.Success) {
            $rcNumber = $rcMatch.Groups[1].Value
            $prereleaseWarning = @"
          > [!TIP]
          > This is our release candidate version $rcNumber. It's mostly a stable build, so it should be safe for regular use, but please report any bugs you find at https://github.com/Paryx-games/roblox-manager/issues.
          "@
          } elseif ($currentTag -like "*-beta*") {
            $prereleaseWarning = @"
          > [!WARNING]
          > This is a beta release. It should be broadly stable, but you may run into occasional bugs. Please report anything unexpected.
          "@
          } elseif ($currentTag -like "*-alpha*") {
            $prereleaseWarning = @"
          > [!CAUTION]
          > This is an alpha release. It is unstable and may contain significant bugs, incomplete features, or data-loss risks. Use at your own risk and avoid running it on production data.
          "@
          }

          $parts = @($changelog, $downloadsTable, $githubNotesBox.Trim(), $sha256, $prereleaseWarning.Trim()) |
            Where-Object { $_ }

          $finalNotes = $parts -join "`n`n"

          Set-Content -Path final-release-notes.md -Value $finalNotes

      - name: determine release type
        id: release-type
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          $isPrerelease = $currentTag -match "-(alpha|beta|rc)"

          "prerelease=$($isPrerelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename-exe.outputs.path }}
          body_path: final-release-notes.md
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          make_latest: "true"
