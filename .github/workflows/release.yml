name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v2.0.0-beta.1"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-slim
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read

    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      previous: ${{ steps.meta.outputs.previous }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust

      - name: Validate tag, application version, and changelog
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' is invalid. Expected vX.Y.Z or vX.Y.Z-pre.N."
            exit 1
          fi

          node ram_ui/scripts/tauri.mjs version:check "$RELEASE_TAG"

          node <<'NODE'
          const fs = require("node:fs");

          const tag = process.env.RELEASE_TAG;
          const lines = fs
            .readFileSync("CHANGELOG.md", "utf8")
            .split(/\r?\n/);

          const start = lines.findIndex(
            (line) => line.trimEnd() === `## ${tag}`,
          );

          if (start < 0) {
            throw new Error(
              `No changelog entry found for ${tag}. ` +
                `Expected a '## ${tag}' heading in CHANGELOG.md.`,
            );
          }

          let end = lines.length;

          for (let i = start + 1; i < lines.length; i++) {
            if (lines[i].startsWith("## ")) {
              end = i;
              break;
            }
          }

          const section = lines
            .slice(start, end)
            .join("\n")
            .trim();

          if (!section) {
            throw new Error(
              `Changelog section for ${tag} is empty.`,
            );
          }

          fs.writeFileSync(
            "release-notes.md",
            `${section}\n`,
          );
          NODE

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          sha="$(
            git rev-parse \
              "refs/tags/${RELEASE_TAG}^{commit}"
          )"

          if [[ -z "$sha" ]]; then
            echo "::error::Could not resolve $RELEASE_TAG to a commit."
            exit 1
          fi

          previous="$(
            git describe \
              --tags \
              --abbrev=0 \
              --match "v*" \
              --exclude "$RELEASE_TAG" \
              "refs/tags/${RELEASE_TAG}^{commit}" \
              2>/dev/null || true
          )"

          prerelease=false
          make_latest=true

          # Preserve the existing RM behaviour:
          # alpha/beta/etc. are prereleases, RCs count as normal releases.
          if [[ "$RELEASE_TAG" == *-* && ! "$RELEASE_TAG" =~ -rc\.[0-9]+$ ]]; then
            prerelease=true
            make_latest=false
          fi

          {
            echo "sha=$sha"
            echo "previous=$previous"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"

      # getReleaseByTag returns published releases.
      # Draft handling is deliberately deferred to the publish job,
      # which has contents: write.
      - name: Ensure release is not already published
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              const { data: release } =
                await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: process.env.TAG,
                });

              core.setFailed(
                `Release ${process.env.TAG} is already published ` +
                  `as release ${release.id}. ` +
                  "With immutable releases enabled it cannot be replaced.",
              );
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Require green CI on tagged commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.SHA;

            const trustedEvents = new Set([
              "push",
              "workflow_dispatch",
            ]);

            // Wait for up to roughly 7.5 minutes.
            // ubuntu-slim has a hard 15-minute job limit, so keep
            // plenty of room for the rest of prepare.
            for (let attempt = 1; attempt <= 30; attempt++) {
              const { data } =
                await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: "ci.yml",
                  head_sha: sha,
                  per_page: 100,
                });

              const runs = data.workflow_runs.filter(
                (run) =>
                  run.head_sha === sha &&
                  trustedEvents.has(run.event),
              );

              const successful = runs.find(
                (run) =>
                  run.status === "completed" &&
                  run.conclusion === "success",
              );

              if (successful) {
                core.info(
                  `CI passed for ${sha}: ${successful.html_url}`,
                );

                return;
              }

              const active = runs.filter(
                (run) => run.status !== "completed",
              );

              const failed = runs.filter(
                (run) =>
                  run.status === "completed" &&
                  run.conclusion !== "success",
              );

              if (failed.length > 0 && active.length === 0) {
                const descriptions = failed
                  .map(
                    (run) =>
                      `${run.conclusion ?? "unknown"}: ${run.html_url}`,
                  )
                  .join("\n");

                core.setFailed(
                  `The tagged commit ${sha} does not have green CI.\n` +
                    descriptions,
                );

                return;
              }

              if (attempt < 30) {
                core.info(
                  `Waiting for ci.yml to pass on ${sha} ` +
                    `(attempt ${attempt}/30)...`,
                );

                await new Promise(
                  (resolve) => setTimeout(resolve, 15000),
                );
              }
            }

            core.setFailed(
              `No successful ci.yml run was found for tagged commit ${sha}. ` +
                "Run CI successfully on this exact commit before releasing it.",
            );

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build
    needs: prepare

    runs-on: windows-latest
    timeout-minutes: 45

    outputs:
      arch: ${{ steps.arch.outputs.value }}

    steps:
      # Important: build the immutable commit SHA validated by prepare,
      # not the mutable tag ref.
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: ram_ui
        run: pnpm install --frozen-lockfile

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] intentionally floating for latest stable rust

      # Restore the cache written by ci.yml's trusted main build.
      # Release runs may consume this cache but never modify it.
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] release restores the main-only CI cache and never saves it
        with:
          shared-key: windows-tauri
          save-if: false

      - name: Build application
        working-directory: ram_ui
        run: pnpm tauri build --ci --bundles nsis -- --locked

      - name: Collect release files
        shell: pwsh
        run: |
          $executable = Get-Item `
            -LiteralPath target/release/rm_tauri.exe `
            -ErrorAction Stop

          $installers = @(
            Get-ChildItem `
              -Path target/release/bundle/nsis `
              -Filter *.exe `
              -ErrorAction Stop
          )

          if ($installers.Count -ne 1) {
            throw (
              "Expected exactly one Tauri NSIS installer, " +
              "found $($installers.Count)."
            )
          }

          New-Item `
            -ItemType Directory `
            -Path release-artifacts |
            Out-Null

          Copy-Item `
            -LiteralPath $executable.FullName `
            -Destination release-artifacts/rm_tauri.exe

          Copy-Item `
            -LiteralPath $installers[0].FullName `
            -Destination release-artifacts/installer.exe

      - name: Detect architecture
        id: arch
        shell: pwsh
        run: |
          $arch = switch ($env:PROCESSOR_ARCHITECTURE) {
            "AMD64" { "x64" }
            "ARM64" { "arm64" }
            "x86"   { "x86" }

            default {
              throw (
                "Unsupported architecture: " +
                "$env:PROCESSOR_ARCHITECTURE"
              )
            }
          }

          "value=$arch" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-executable
          path: release-artifacts/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  metadata:
    name: Generate release notes
    needs: prepare

    runs-on: ubuntu-slim
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Generate GitHub release notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ env.RELEASE_TAG }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous }}
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;

            const delays = [
              0,
              5000,
              15000,
              30000,
            ];

            let notes = "";

            for (const delay of delays) {
              if (delay) {
                await new Promise(
                  (resolve) => setTimeout(resolve, delay),
                );
              }

              try {
                const request = {
                  owner,
                  repo,
                  tag_name: process.env.TAG,
                };

                if (process.env.PREVIOUS_TAG) {
                  request.previous_tag_name =
                    process.env.PREVIOUS_TAG;
                }

                const { data } =
                  await github.rest.repos.generateReleaseNotes(
                    request,
                  );

                notes = String(data.body ?? "").trim();
                break;
              } catch (error) {
                core.warning(
                  `GitHub release-note generation failed: ` +
                    `${error.message}`,
                );
              }
            }

            if (notes) {
              const fullChangelog =
                notes.match(
                  /^\*\*Full Changelog\*\*:.*$/m,
                )?.[0] ?? "";

              const cut =
                notes.indexOf("## New Contributors");

              if (cut >= 0) {
                notes = notes.slice(0, cut).trim();

                if (fullChangelog) {
                  notes =
                    `${notes}\n\n${fullChangelog}`;
                }
              }
            } else {
              core.warning(
                "GitHub could not generate release notes; " +
                  "the maintained changelog will still be used.",
              );
            }

            fs.writeFileSync(
              "github-release-notes.md",
              notes ? `${notes}\n` : "",
            );

      - name: Upload GitHub release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-notes
          path: github-release-notes.md
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package and attest
    needs:
      - prepare
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-executable
          path: release

      - name: Rename files and generate SHA256 checksums
        shell: pwsh
        env:
          ARCH: ${{ needs.build.outputs.arch }}
        run: |
          $version =
            $env:RELEASE_TAG -replace '^v', ''

          $base =
            "roblox-manager-v$version-windows-$env:ARCH"

          if (-not (Test-Path release/rm_tauri.exe)) {
            throw (
              "rm_tauri.exe was not found in the " +
              "release directory."
            )
          }

          if (-not (Test-Path release/installer.exe)) {
            throw (
              "installer.exe was not found in the " +
              "release directory."
            )
          }

          Move-Item `
            -LiteralPath release/rm_tauri.exe `
            -Destination "release/$base.exe"

          Move-Item `
            -LiteralPath release/installer.exe `
            -Destination "release/$base-setup.exe"

          $hashes = [ordered]@{}

          foreach (
            $file in Get-ChildItem `
              -Path release `
              -Filter *.exe |
              Sort-Object Name
          ) {
            $hashes[$file.Name] = (
              Get-FileHash `
                -LiteralPath $file.FullName `
                -Algorithm SHA256
            ).Hash.ToLower()
          }

          $checksums = foreach ($name in $hashes.Keys) {
            "$($hashes[$name])  $name"
          }

          Set-Content `
            -Path release/SHA256SUMS.txt `
            -Value $checksums

      # This is a hard release gate.
      # Both Windows executables and the checksum manifest are attested.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*.exe
            release/SHA256SUMS.txt

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  virustotal:
    name: VirusTotal
    needs:
      - prepare
      - package

    runs-on: ubuntu-latest
    timeout-minutes: 15

    # VIRUSTOTAL_API_KEY may be kept as a repository secret,
    # but an environment secret with the same name is more tightly scoped.
    environment: release

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Verify and scan release executables
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          TAG_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $checksumPath =
            "release/SHA256SUMS.txt"

          if (-not (Test-Path -LiteralPath $checksumPath)) {
            throw "SHA256SUMS.txt is missing."
          }

          $expected = @{}

          foreach (
            $line in Get-Content `
              -LiteralPath $checksumPath
          ) {
            if (
              $line -notmatch
                '^([0-9a-fA-F]{64})\s{2}(.+)$'
            ) {
              throw (
                "Invalid SHA256SUMS.txt line: " +
                "'$line'"
              )
            }

            $expected[$Matches[2]] =
              $Matches[1].ToLower()
          }

          $files = @(
            Get-ChildItem `
              -Path release `
              -Filter *.exe |
              Sort-Object Name
          )

          if ($files.Count -ne 2) {
            throw (
              "Expected exactly two release executables, " +
              "found $($files.Count)."
            )
          }

          # Artifact integrity belongs to our own release pipeline.
          # These checks remain hard failures.
          foreach ($file in $files) {
            if (-not $expected.ContainsKey($file.Name)) {
              throw (
                "No expected SHA256 exists for " +
                "$($file.Name)."
              )
            }

            $actual = (
              Get-FileHash `
                -LiteralPath $file.FullName `
                -Algorithm SHA256
            ).Hash.ToLower()

            if (
              $actual -ne
              $expected[$file.Name]
            ) {
              throw (
                "SHA256 mismatch for $($file.Name). " +
                "The packaged artifact changed."
              )
            }
          }

          function New-VtResult {
            param(
              [string]$Name,
              [string]$Hash,
              [string]$Message,
              [string]$ReportUrl = "",
              [int]$Flagged = -1,
              [int]$Total = -1
            )

            return [pscustomobject]@{
              Name = $Name
              Hash = $Hash
              Message = $Message
              ReportUrl = $ReportUrl
              Flagged = $Flagged
              Total = $Total
            }
          }

          function Scan-VirusTotal {
            param(
              [System.IO.FileInfo]$File,
              [string]$Hash
            )

            if (-not $env:VT_API_KEY) {
              return New-VtResult `
                -Name $File.Name `
                -Hash $Hash `
                -Message (
                  "Scan unavailable: VIRUSTOTAL_API_KEY " +
                  "is not configured."
                )
            }

            $headers = @{
              "x-apikey" = $env:VT_API_KEY
            }

            $uploadUri =
              "https://www.virustotal.com/api/v3/files"

            if ($File.Length -gt 32MB) {
              try {
                $uploadUri = (
                  Invoke-RestMethod `
                    -Uri "$uploadUri/upload_url" `
                    -Headers $headers `
                    -TimeoutSec 20
                ).data
              } catch {
                return New-VtResult `
                  -Name $File.Name `
                  -Hash $Hash `
                  -Message (
                    "Scan unavailable: could not obtain " +
                    "a VirusTotal upload URL. " +
                    "$($_.Exception.Message)"
                  )
              }
            }

            $upload = $null
            $lastUploadError = ""

            # Best-effort upload. Do not allow VirusTotal to keep
            # the release job blocked indefinitely.
            foreach ($delay in @(0, 15)) {
              if ($delay -gt 0) {
                Start-Sleep -Seconds $delay
              }

              try {
                $upload = Invoke-RestMethod `
                  -Uri $uploadUri `
                  -Method Post `
                  -Headers $headers `
                  -Form @{
                    file = $File
                  } `
                  -TimeoutSec 45

                if (
                  $upload -and
                  $upload.data -and
                  $upload.data.id
                ) {
                  break
                }
              } catch {
                $lastUploadError =
                  $_.Exception.Message

                Write-Host (
                  "::warning::VirusTotal upload for " +
                  "$($File.Name) failed: " +
                  "$lastUploadError"
                )
              }
            }

            if (
              -not $upload -or
              -not $upload.data -or
              -not $upload.data.id
            ) {
              return New-VtResult `
                -Name $File.Name `
                -Hash $Hash `
                -Message (
                  "Scan unavailable: upload failed " +
                  "after multiple attempts. " +
                  "$lastUploadError"
                )
            }

            $analysisId =
              $upload.data.id

            $reportUrl =
              "https://www.virustotal.com/gui/file/$Hash"

            $analysis = $null

            # Poll every 20 seconds for up to roughly two minutes.
            # Request timeouts keep the whole job well below its
            # 15-minute GitHub Actions timeout even for both files.
            for ($i = 0; $i -lt 6; $i++) {
              Start-Sleep -Seconds 20

              try {
                $candidate =
                  Invoke-RestMethod `
                    -Uri (
                      "https://www.virustotal.com/" +
                      "api/v3/analyses/$analysisId"
                    ) `
                    -Headers $headers `
                    -TimeoutSec 15
              } catch {
                Write-Host (
                  "::warning::VirusTotal polling for " +
                  "$($File.Name) failed: " +
                  "$($_.Exception.Message)"
                )

                continue
              }

              if (
                $candidate.data.attributes.status -eq
                "completed"
              ) {
                $analysis = $candidate
                break
              }
            }

            if (-not $analysis) {
              return New-VtResult `
                -Name $File.Name `
                -Hash $Hash `
                -ReportUrl $reportUrl `
                -Message (
                  "Scan unavailable: VirusTotal did not " +
                  "finish within the polling window."
                )
            }

            $stats =
              $analysis.data.attributes.stats

            $flagged =
              [int]$stats.malicious +
              [int]$stats.suspicious

            $total = 0

            foreach (
              $property in $stats.PSObject.Properties
            ) {
              $total +=
                [int]$property.Value
            }

            return New-VtResult `
              -Name $File.Name `
              -Hash $Hash `
              -ReportUrl $reportUrl `
              -Flagged $flagged `
              -Total $total `
              -Message (
                "$flagged / $total security vendors " +
                "flagged this file"
              )
          }

          $results = @()

          for ($i = 0; $i -lt $files.Count; $i++) {
            $file = $files[$i]
            $hash = $expected[$file.Name]

            if ($i -gt 0) {
              # Give the free-tier API a little breathing room
              # between the two files.
              Start-Sleep -Seconds 20
            }

            # Anything unexpected inside the external VT integration
            # is converted into a warning rather than failing release.
            try {
              $result =
                Scan-VirusTotal `
                  -File $file `
                  -Hash $hash
            } catch {
              $result =
                New-VtResult `
                  -Name $file.Name `
                  -Hash $hash `
                  -Message (
                    "Scan unavailable: " +
                    "$($_.Exception.Message)"
                  )
            }

            $results += $result

            if (
              $result.Flagged -gt 0 -or
              $result.Flagged -lt 0
            ) {
              Write-Host (
                "::warning::$($result.Name): " +
                "$($result.Message)"
              )
            }
          }

          $workflowUrl =
            "https://github.com/$env:REPO/blob/" +
            "$env:TAG_SHA/.github/workflows/release.yml"

          $security = @(
            "## Security"
            ""
            "GitHub build provenance attestations are generated for both Windows executables and the checksum manifest."
            ""
            "Verify a downloaded artifact with:"
            ""
            '```text'
            "gh attestation verify <file> --repo $env:REPO"
            '```'
            ""
            "### VirusTotal"
            ""
            "VirusTotal scanning is best-effort and does not block a release if the external service is unavailable."
            ""
          )

          foreach ($result in $results) {
            $security += @(
              "- **``$($result.Name)``**"
              "  - SHA256: ``$($result.Hash)``"
              "  - Scan result: $($result.Message)"
            )

            if ($result.ReportUrl) {
              $security +=
                "  - Report: $($result.ReportUrl)"
            }

            $security += ""
          }

          $security +=
            "- **Build workflow:** [``release.yml``]($workflowUrl)"

          Set-Content `
            -Path security.md `
            -Value ($security -join "`n")

          $summary = @(
            "## VirusTotal"
            ""
          )

          foreach ($result in $results) {
            $summary += @(
              "### $($result.Name)"
              ""
              "- SHA256: ``$($result.Hash)``"
              "- $($result.Message)"
            )

            if ($result.ReportUrl) {
              $summary +=
                "- [Open VirusTotal report]($($result.ReportUrl))"
            }

            $summary += ""
          }

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value ($summary -join "`n")

      - name: Upload security notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-notes
          path: security.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs:
      - prepare
      - build
      - package
      - metadata
      - virustotal

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Download changelog notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes/changelog

      - name: Download GitHub release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-release-notes
          path: notes/github

      - name: Download security notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-notes
          path: notes/security

      - name: Assemble release notes
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG

          function Read-Part($path) {
            "$(
              Get-Content `
                -LiteralPath $path `
                -Raw
            )".Trim()
          }

          $archDescriptions = @{
            "windows-x64" =
              "For a normal Intel or AMD Windows PC"

            "windows-arm64" =
              "For a Windows PC with an ARM processor"

            "windows-x86" =
              "For a 32-bit Windows PC"
          }

          $rows = foreach (
            $file in Get-ChildItem `
              -Path release `
              -Filter *.exe |
              Sort-Object Name
          ) {
            if (
              $file.Name -match (
                '^roblox-manager-v.+?-' +
                '(?<platform>windows-(?:x64|arm64|x86))' +
                '(?<installer>-setup)?\.exe$'
              )
            ) {
              $description =
                $archDescriptions[$Matches.platform]

              if ($Matches.installer) {
                $description +=
                  " - installer"
              } else {
                $description +=
                  " - portable app (requires WebView2 Runtime)"
              }

              $url =
                "https://github.com/$env:REPO/" +
                "releases/download/$tag/$($file.Name)"

              "| [``$($file.Name)``]($url) | $description |"
            } else {
              Write-Host (
                "::warning::$($file.Name) did not match " +
                "the download table pattern."
              )
            }
          }

          $table = (@(
            "<details>"
            "<summary>Which download do I want?</summary>"
            ""
            "| File | Use case |"
            "| --- | --- |"
          ) + @($rows) + @(
            ""
            "</details>"
          )) -join "`n"

          $checksums = @(
            Get-Content `
              -LiteralPath release/SHA256SUMS.txt
          )

          $sha256 = (@(
            "## SHA256"
            ""
            "Checksums for all executable files included in this release."
            ""
          ) + @(
            $checksums |
              ForEach-Object {
                "- ``$_``"
              }
          )) -join "`n"

          $changelog =
            Read-Part `
              notes/changelog/release-notes.md

          $github =
            Read-Part `
              notes/github/github-release-notes.md

          $security =
            Read-Part `
              notes/security/security.md

          $githubBox = ""

          if ($github) {
            $githubBox = @(
              "> [!NOTE]"
              (
                "> The section below may be inaccurate, " +
                "as it's auto-generated by GitHub Actions. " +
                "See [CHANGELOG.md]" +
                "(https://github.com/$env:REPO/blob/main/CHANGELOG.md) " +
                "for the maintained changelog."
              )
              ""
              "<details>"
              "<summary>GitHub-generated notes</summary>"
              ""
              $github
              ""
              "</details>"
            ) -join "`n"
          }

          $prerelease = ""

          if ($tag -match '-rc\.(\d+)') {
            $prerelease = @(
              "> [!TIP]"
              (
                "> This is our release candidate version " +
                "$($Matches[1]). It's mostly a stable build, " +
                "so it should be safe for regular use, but " +
                "please report any bugs you find at " +
                "https://github.com/$env:REPO/issues."
              )
            ) -join "`n"
          } elseif ($tag -like "*-beta*") {
            $prerelease = @(
              "> [!WARNING]"
              (
                "> This is a beta release. It should be " +
                "broadly stable, but you may run into " +
                "occasional bugs. Please report anything " +
                "unexpected."
              )
            ) -join "`n"
          } elseif ($tag -like "*-alpha*") {
            $prerelease = @(
              "> [!CAUTION]"
              (
                "> This is an alpha release. It is unstable " +
                "and may contain significant bugs, incomplete " +
                "features, or data-loss risks. Use at your " +
                "own risk and avoid production data."
              )
            ) -join "`n"
          }

          $parts = @(
            $changelog
            $table
            $githubBox
            $sha256
            $security
            $prerelease
          ) |
            Where-Object {
              $_
            }

          Set-Content `
            -Path final-release-notes.md `
            -Value ($parts -join "`n`n")

      # This job has contents: write, so draft visibility/cleanup belongs
      # here rather than in prepare.
      - name: Clean up leftover draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const { owner, repo } = context.repo;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner,
                repo,
                per_page: 100,
              },
            );

            const matching = releases.filter(
              (release) => release.tag_name === process.env.TAG,
            );

            const published = matching.find(
              (release) => !release.draft,
            );

            if (published) {
              core.setFailed(
                `Release ${process.env.TAG} was published while ` +
                  "this workflow was running.",
              );

              return;
            }

            const drafts = matching.filter(
              (release) => release.draft,
            );

            if (drafts.length > 1) {
              core.setFailed(
                `Found ${drafts.length} draft releases for ` +
                  `${process.env.TAG}. Clean them up manually.`,
              );

              return;
            }

            if (drafts.length === 1) {
              core.warning(
                `Removing leftover draft release ${drafts[0].id}.`,
              );

              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: drafts[0].id,
              });
            }

      # Final TOCTOU check:
      # the tag must still point at the exact commit prepare validated
      # and build compiled.
      - name: Confirm tag still points at validated commit
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail

          url="https://github.com/$REPO"

          current="$(
            git ls-remote \
              "$url" \
              "refs/tags/${RELEASE_TAG}^{}" |
              cut -f1
          )"

          if [[ -z "$current" ]]; then
            current="$(
              git ls-remote \
                "$url" \
                "refs/tags/${RELEASE_TAG}" |
                cut -f1
            )"
          fi

          if [[ -z "$current" ]]; then
            echo "::error::Tag $RELEASE_TAG no longer exists."
            exit 1
          fi

          if [[ "$current" != "$SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG moved during the release run."
            echo "::error::Validated commit: $SHA"
            echo "::error::Current tag commit: $current"
            exit 1
          fi

          echo "Tag still points at validated commit $SHA."

      # Nothing before this step creates a GitHub Release.
      #
      # At this point:
      # - tag/version/changelog validation passed
      # - exact commit CI passed
      # - exact validated commit was built
      # - package integrity was checked
      # - build provenance was generated
      # - both EXEs were offered to VirusTotal
      # - release metadata was assembled
      # - stale drafts were handled
      # - the tag was re-checked against the validated SHA
      - name: Create draft release and upload assets
        id: create-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 # zizmor: ignore[superfluous-actions] retain explicit draft creation, asset validation and metadata before publishing
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.prepare.outputs.sha }}

          files: |
            release/*.exe
            release/SHA256SUMS.txt

          fail_on_unmatched_files: true
          body_path: final-release-notes.md

          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.make_latest }}

          draft: true

      # Publishing is the immutable boundary.
      # Keep this as the final operation in the workflow.
      - name: Publish release
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.create-release.outputs.id }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_MAKE_LATEST: ${{ needs.prepare.outputs.make_latest }}
        run: |
          if (-not $env:RELEASE_ID) {
            throw (
              "Draft release ID was not returned " +
              "by action-gh-release."
            )
          }

          $published = $false

          foreach ($delay in @(0, 5, 15)) {
            if ($delay -gt 0) {
              Start-Sleep -Seconds $delay
            }

            gh api `
              --method PATCH `
              "repos/$env:REPO/releases/$env:RELEASE_ID" `
              -F draft=false `
              -F "prerelease=$env:RELEASE_PRERELEASE" `
              -f "make_latest=$env:RELEASE_MAKE_LATEST" |
              Out-Null

            if ($LASTEXITCODE -eq 0) {
              $published = $true
              break
            }

            # The API may have accepted the publish request even if
            # the client lost the response. Check before retrying an
            # operation that crosses the immutable boundary.
            $draftState = gh api `
              "repos/$env:REPO/releases/$env:RELEASE_ID" `
              --jq ".draft" `
              2>$null

            if (
              $LASTEXITCODE -eq 0 -and
              $draftState -eq "false"
            ) {
              $published = $true
              break
            }

            Write-Host (
              "Publish attempt failed; retrying."
            )
          }

          if (-not $published) {
            throw (
              "Could not publish the draft release. " +
              "It remains a draft."
            )
          }

          $global:LASTEXITCODE = 0
