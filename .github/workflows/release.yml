name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  cargo_term_color: always

jobs:
  build:
    name: build
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release

      - name: upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ram_ui
          path: target/release/ram_ui.exe
          retention-days: 1

  release:
    name: release
    needs: build
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: download executable
        uses: actions/download-artifact@v4
        with:
          name: ram_ui
          path: release

      - name: get previous tag
        id: previous-tag
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          $tags = git tag --sort=-version:refname |
            Where-Object { $_ -ne $currentTag }

          if (-not $tags) {
            "value=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          "value=$($tags[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: extract changelog
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $path = "CHANGELOG.md"
          $lines = Get-Content $path

          $start = -1
          $end = $lines.Count

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## $([regex]::Escape($version))$") {
              $start = $i
              break
            }
          }

          if ($start -eq -1) {
            throw "No changelog entry found for $version"
          }

          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## ") {
              $end = $i
              break
            }
          }

          $section = ($lines[$start..($end - 1)] -join "`n")
          Set-Content -Path release-notes.md -Value $section

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/ram_ui.exe
          generate_release_notes: true
          previous_tag: ${{ steps.previous-tag.outputs.value }}
          body_path: release-notes.md
          body: |
            > [!NOTE]
            > This was auto-generated by GitHub Actions. It may be inaccurate. Please check [CHANGELOG.md](https://github.com/Paryx-games/roblox-manager/blob/main/CHANGELOG.md) for a detailed changelog.
