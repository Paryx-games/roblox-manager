name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --locked

      - name: upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ram_ui
          path: target/release/ram_ui.exe
          retention-days: 1

  release:
    name: release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: download executable
        uses: actions/download-artifact@v4
        with:
          name: ram_ui
          path: release

      - name: get previous tag
        id: previous-tag
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          $tags = git tag --sort=-version:refname |
            Where-Object { $_ -ne $currentTag -and $_ -like "v*" }

          if (-not $tags) {
            "value=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          "value=$($tags[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: extract changelog
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $path = "CHANGELOG.md"
          $lines = Get-Content $path

          $start = -1
          $end = $lines.Count

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## $([regex]::Escape($version))$") {
              $start = $i
              break
            }
          }

          if ($start -eq -1) {
            throw "No changelog entry found for $version"
          }

          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## ") {
              $end = $i
              break
            }
          }

          $section = ($lines[$start..($end - 1)] -join "`n")
          Set-Content -Path release-notes.md -Value $section

      - name: generate github release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "${{ github.ref_name }}"
          $previousTag = "${{ steps.previous-tag.outputs.value }}"
          $repository = "${{ github.repository }}"

          if ($previousTag) {
            $response = gh api `
              --method POST `
              "repos/$repository/releases/generate-notes" `
              -f "tag_name=$currentTag" `
              -f "target_commitish=${{ github.sha }}" `
              -f "previous_tag_name=$previousTag"
          } else {
            $response = gh api `
              --method POST `
              "repos/$repository/releases/generate-notes" `
              -f "tag_name=$currentTag" `
              -f "target_commitish=${{ github.sha }}"
          }

          $generated = $response | ConvertFrom-Json
          $notes = $generated.body

          Set-Content -Path github-release-notes.md -Value $notes.Trim()

      # sha256 for the single release exe, inserted between the github notes
      # and its own "New Contributors" section.
      - name: generate sha256 checksums
        shell: pwsh
        run: |
          $exePath = "release/ram_ui.exe"

          if (-not (Test-Path $exePath)) {
            throw "ram_ui.exe was not found in the release directory."
          }

          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()

          $lines = @(
            "## SHA256"
            ""
            "Checksums for all executable files included in this release."
            ""
            "- ``ram_ui.exe`` - ``$hash``"
          )

          Set-Content -Path sha256.md -Value ($lines -join "`n")

      - name: assemble release notes
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"

          $changelog = (Get-Content -Path release-notes.md -Raw).Trim()
          $githubNotes = (Get-Content -Path github-release-notes.md -Raw).Trim()
          $sha256 = (Get-Content -Path sha256.md -Raw).Trim()

          # split github notes on "## New Contributors" so sha256 can sit above it
          $splitMarker = "## New Contributors"
          $splitIndex = $githubNotes.IndexOf($splitMarker)

          if ($splitIndex -ge 0) {
            $beforeContributors = $githubNotes.Substring(0, $splitIndex).Trim()
            $contributorsSection = $githubNotes.Substring($splitIndex).Trim()
          } else {
            $beforeContributors = $githubNotes
            $contributorsSection = ""
          }

          $warning = @"
          > [!NOTE]
          > This was auto-generated by GitHub Actions. It may be inaccurate. Please check [CHANGELOG.md](https://github.com/Paryx-games/roblox-manager/blob/main/CHANGELOG.md) for a detailed changelog.
          "@

          # pre-release tags get an extra notice stacked under the standard one
          $prereleaseWarning = ""
          $rcMatch = [regex]::Match($currentTag, "-rc\.(\d+)")

          if ($rcMatch.Success) {
            $rcNumber = $rcMatch.Groups[1].Value
            $prereleaseWarning = @"
          > [!TIP]
          > This is our release candidate version $rcNumber. It's mostly a stable build, so it should be safe for regular use, but please report any bugs you find at https://github.com/Paryx-games/roblox-manager/issues.
          "@
          } elseif ($currentTag -like "*-beta*") {
            $prereleaseWarning = @"
          > [!WARNING]
          > This is a beta release. It should be broadly stable, but you may run into occasional bugs. Please report anything unexpected.
          "@
          } elseif ($currentTag -like "*-alpha*") {
            $prereleaseWarning = @"
          > [!CAUTION]
          > This is an alpha release. It is unstable and may contain significant bugs, incomplete features, or data-loss risks. Use at your own risk and avoid running it on production data.
          "@
          }

          $parts = @($changelog, $beforeContributors, $sha256, $contributorsSection, $warning.Trim(), $prereleaseWarning.Trim()) |
            Where-Object { $_ }

          $finalNotes = $parts -join "`n`n"

          Set-Content -Path final-release-notes.md -Value $finalNotes

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/ram_ui.exe
          body_path: final-release-notes.md
