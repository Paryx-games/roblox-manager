name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag whose release is not yet published, e.g. v2.0.0-beta.1"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      previous: ${{ steps.meta.outputs.previous }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup rust
        shell: pwsh
        run: ./scripts/setup-rust.ps1

      - name: Validate tag, application version, and changelog
        shell: pwsh
        run: node .github/scripts/release.cjs

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: ./scripts/resolve-release-metadata.ps1

      # defer draft handling to the job with write access
      - name: Ensure release is not already published
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              const { data: release } =
                await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: process.env.TAG,
                });

              core.setFailed(
                `Release ${process.env.TAG} is already published ` +
                  `as release ${release.id}. ` +
                  "With immutable releases enabled it cannot be replaced.",
              );
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 5

  wait-for-ci:
    name: Wait for green CI
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require green CI on tagged commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.SHA;

            const trustedEvents = new Set([
              "push",
              "workflow_dispatch",
            ]);

            // allow CI to finish on the exact validated commit
            for (let attempt = 1; attempt <= 120; attempt++) {
              const { data } =
                await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: "ci.yml",
                  head_sha: sha,
                  per_page: 100,
                });

              const runs = data.workflow_runs.filter(
                (run) =>
                  run.head_sha === sha &&
                  trustedEvents.has(run.event),
              );

              const successful = runs.find(
                (run) =>
                  run.status === "completed" &&
                  run.conclusion === "success",
              );

              if (successful) {
                core.info(
                  `CI passed for ${sha}: ${successful.html_url}`,
                );

                return;
              }

              const active = runs.filter(
                (run) => run.status !== "completed",
              );

              const failed = runs.filter(
                (run) =>
                  run.status === "completed" &&
                  run.conclusion !== "success",
              );

              if (failed.length > 0 && active.length === 0) {
                const descriptions = failed
                  .map(
                    (run) =>
                      `${run.conclusion ?? "unknown"}: ${run.html_url}`,
                  )
                  .join("\n");

                core.setFailed(
                  `The tagged commit ${sha} does not have green CI.\n` +
                    descriptions,
                );

                return;
              }

              if (attempt < 120) {
                core.info(
                  `Waiting for ci.yml to pass on ${sha} ` +
                    `(attempt ${attempt}/120)...`,
                );

                await new Promise(
                  (resolve) => setTimeout(resolve, 15000),
                );
              }
            }

            core.setFailed(
              `No successful ci.yml run was found for tagged commit ${sha}. ` +
                "Run CI successfully on this exact commit before releasing it.",
            );

  build:
    name: Build
    needs: [prepare, wait-for-ci]

    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # build the validated commit even if the tag moves
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: ram_ui
        run: pnpm install --frozen-lockfile

      - name: Setup rust
        shell: pwsh
        run: ./scripts/setup-rust.ps1

      # consume the trusted main cache without saving release entries
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] release restores the main-only CI cache and never saves it
        with:
          shared-key: windows-tauri
          save-if: false

      - name: Build application
        working-directory: ram_ui
        run: pnpm tauri build --ci --bundles nsis -- --locked

      - name: Collect release files
        shell: pwsh
        run: |
          $executable = Get-Item `
            -LiteralPath target/release/rm_tauri.exe `
            -ErrorAction Stop

          $installers = @(
            Get-ChildItem `
              -Path target/release/bundle/nsis `
              -Filter *.exe `
              -ErrorAction Stop
          )

          if ($installers.Count -ne 1) {
            throw (
              "Expected exactly one Tauri NSIS installer, " +
              "found $($installers.Count)."
            )
          }

          New-Item `
            -ItemType Directory `
            -Path release-artifacts |
            Out-Null

          Copy-Item `
            -LiteralPath $executable.FullName `
            -Destination release-artifacts/rm_tauri.exe

          Copy-Item `
            -LiteralPath $installers[0].FullName `
            -Destination release-artifacts/installer.exe

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-executable
          path: release-artifacts/*.exe
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  metadata:
    name: Generate release notes
    needs: prepare

    runs-on: ubuntu-slim
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Generate GitHub release notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ env.RELEASE_TAG }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous }}
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;

            const delays = [
              0,
              5000,
              15000,
              30000,
            ];

            let notes = "";

            for (const delay of delays) {
              if (delay) {
                await new Promise(
                  (resolve) => setTimeout(resolve, delay),
                );
              }

              try {
                const request = {
                  owner,
                  repo,
                  tag_name: process.env.TAG,
                };

                if (process.env.PREVIOUS_TAG) {
                  request.previous_tag_name =
                    process.env.PREVIOUS_TAG;
                }

                const { data } =
                  await github.rest.repos.generateReleaseNotes(
                    request,
                  );

                notes = String(data.body ?? "").trim();
                break;
              } catch (error) {
                core.warning(
                  `GitHub release-note generation failed: ` +
                    `${error.message}`,
                );
              }
            }

            if (notes) {
              const fullChangelog =
                notes.match(
                  /^\*\*Full Changelog\*\*:.*$/m,
                )?.[0] ?? "";

              const cut =
                notes.indexOf("## New Contributors");

              if (cut >= 0) {
                notes = notes.slice(0, cut).trim();

                if (fullChangelog) {
                  notes =
                    `${notes}\n\n${fullChangelog}`;
                }
              }
            } else {
              core.warning(
                "GitHub could not generate release notes; " +
                  "the maintained changelog will still be used.",
              );
            }

            fs.writeFileSync(
              "github-release-notes.md",
              notes ? `${notes}\n` : "",
            );

      - name: Upload GitHub release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-notes
          path: github-release-notes.md
          if-no-files-found: error
          retention-days: 5

  package:
    name: Package and attest
    needs:
      - prepare
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout validated release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-executable
          path: release

      - name: Rename files and generate SHA256 checksums
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: ./scripts/package-release.ps1

      - name: Summarize packages for approval
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: ./scripts/release-summary.ps1

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*.exe
            release/*.txt

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  virustotal:
    name: VirusTotal
    needs:
      - prepare
      - package

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: release

    steps:
      - name: Checkout validated release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Verify and scan release downloads
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          TAG_SHA: ${{ needs.prepare.outputs.sha }}
        run: ./scripts/virustotal.ps1

      - name: Upload security notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-notes
          path: security.md
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish
    needs:
      - prepare
      - wait-for-ci
      - build
      - package
      - metadata
      - virustotal

    runs-on: ubuntu-latest
    timeout-minutes: 10

    # pauses for manual approval before the immutable publish
    environment: release-publish

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout validated release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Download changelog notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes/changelog

      - name: Download GitHub release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-release-notes
          path: notes/github

      - name: Download security notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-notes
          path: notes/security

      - name: Verify downloaded release packages
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS.txt)
          artifact_sha="$(tr -d '\r\n\357\273\277' < release/COMMIT.txt)"
          [[ "$artifact_sha" == "$RELEASE_SHA" ]] || { echo 'Artifact commit mismatch'; exit 1; }

      - name: Assemble release notes
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: node scripts/write-release-notes.cjs

      - name: Clean up leftover draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const { owner, repo } = context.repo;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner,
                repo,
                per_page: 100,
              },
            );

            const matching = releases.filter(
              (release) => release.tag_name === process.env.TAG,
            );

            const published = matching.find(
              (release) => !release.draft,
            );

            if (published) {
              core.setFailed(
                `Release ${process.env.TAG} was published while ` +
                  "this workflow was running.",
              );

              return;
            }

            const drafts = matching.filter(
              (release) => release.draft,
            );

            if (drafts.length > 1) {
              core.setFailed(
                `Found ${drafts.length} draft releases for ` +
                  `${process.env.TAG}. Clean them up manually.`,
              );

              return;
            }

            if (drafts.length === 1) {
              core.warning(
                `Removing leftover draft release ${drafts[0].id}.`,
              );

              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: drafts[0].id,
              });
            }

      # reject tag changes before creating a draft
      - name: Confirm tag still points at validated commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').confirmTag({ github, context });

      - name: Create draft release and upload assets
        id: create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.6.2 # zizmor: ignore[superfluous-actions]
        with:
          name: ${{ env.RELEASE_TAG }} - Roblox Manager
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.prepare.outputs.sha }}

          files: |
            release/*.exe
            release/*.txt

          fail_on_unmatched_files: true
          body_path: final-release-notes.md

          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.make_latest }}

          draft: true

      - name: Recheck tag immediately before publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').confirmTag({ github, context });

      # publication is the final immutable boundary
      - name: Publish release
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.create-release.outputs.id }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_MAKE_LATEST: ${{ needs.prepare.outputs.make_latest }}
        run: |
          if (-not $env:RELEASE_ID) {
            throw (
              "Draft release ID was not returned " +
              "by action-gh-release."
            )
          }

          $published = $false

          foreach ($delay in @(0, 5, 15)) {
            if ($delay -gt 0) {
              Start-Sleep -Seconds $delay
            }

            gh api `
              --method PATCH `
              "repos/$env:REPO/releases/$env:RELEASE_ID" `
              -F draft=false `
              -F "prerelease=$env:RELEASE_PRERELEASE" `
              -f "make_latest=$env:RELEASE_MAKE_LATEST" |
              Out-Null

            if ($LASTEXITCODE -eq 0) {
              $published = $true
              break
            }

            # a lost response may still mean publication succeeded
            $draftState = gh api `
              "repos/$env:REPO/releases/$env:RELEASE_ID" `
              --jq ".draft" `
              2>$null

            if (
              $LASTEXITCODE -eq 0 -and
              $draftState -eq "false"
            ) {
              $published = $true
              break
            }

            Write-Host (
              "Publish attempt failed; retrying."
            )
          }

          if (-not $published) {
            throw (
              "Could not publish the draft release. " +
              "It remains a draft."
            )
          }

          $global:LASTEXITCODE = 0
