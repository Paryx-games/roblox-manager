name: Bug report
description: Report a reproducible problem with Roblox Manager
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Do not include cookies, tokens, tickets, passwords, private server codes, or unredacted logs.** Report security vulnerabilities privately through [GitHub Security Advisories](https://github.com/Paryx-games/roblox-manager/security/advisories/new), not in a public issue.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened, what you expected, and any error message.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: RM and Windows versions
      description: Include your RM release (or commit if built from source) and Windows version. Exact Windows build numbers are optional.
      placeholder: "Example: RM v2.0.0-beta.1, Windows 11"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions that led to the problem. If you cannot reproduce it, describe what you were doing.
      placeholder: |
        1. Open RM
        2. Select ...
        3. Click ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency (optional)
      description: How often does it happen when you follow these steps?
      options:
        - Every time
        - Sometimes
        - Only happened once
        - Not sure

  - type: textarea
    id: logs
    attributes:
      label: Attachments (optional)
      description: Paste relevant logs or drag in screenshots. Redact cookies, tokens, passwords, account names, usernames, and private server codes first.
