name: Feature request
description: Suggest an improvement or new capability for Roblox Manager
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Suggest an improvement for RM. Do not include cookies, tokens, passwords, or private server codes.

  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: Describe what you would like and why it would help.
      placeholder: "I would like ... because ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives (optional)
      description: Mention any workarounds or other solutions you have considered.

  - type: textarea
    id: examples
    attributes:
      label: Examples (optional)
      description: Add screenshots, mockups, links, or examples of similar behavior.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution (optional)
      options:
        - label: I would be interested in helping implement this feature.
