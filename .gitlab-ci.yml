workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - check
  - build
  - release

variables:
  CARGO_TERM_COLOR: always

# Lint and test every push to main. Tag pipelines skip this and go straight
# to build, since the tagged commit already passed on its way through main.
check:
  stage: check
  tags:
    - windows
    - self-hosted
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  # No cache stanza on purpose. This is a shell runner, so its build
  # directory (and target/ inside it) already persists between jobs, and
  # GitLab's cache would zip and unzip several GB of artifacts to
  # reproduce something we already have on disk.
  script:
    # Same PATH fixup as the build job, see the comment there.
    - $env:PATH = "C:\Users\Keeper\.cargo\bin;" + $env:PATH
    - rustup default stable
    # clippy implies check, so there's no separate cargo check step.
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace

build:
  stage: build
  tags:
    - windows
    - self-hosted
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  cache:
    key: windows-release
    paths:
      - target/
  script:
    # The runner service runs as LocalSystem and doesn't inherit Keeper's
    # cargo/rustup bin on PATH. Prepend it so the toolchain resolves.
    - $env:PATH = "C:\Users\Keeper\.cargo\bin;" + $env:PATH
    - rustup default stable
    - cargo build --release
    - |
      $url = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/ram_ui/$env:CI_COMMIT_TAG/ram_ui.exe"
      curl.exe --fail --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file target/release/ram_ui.exe $url

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [build]
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "See [CHANGELOG.md]($CI_PROJECT_URL/-/blob/main/CHANGELOG.md) for details."
    assets:
      links:
        - name: ram_ui.exe
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ram_ui/$CI_COMMIT_TAG/ram_ui.exe"
